<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Panelyze's icon: a manga page (black ink on cream paper) with one panel, in hanko vermilion, pulled out of its place. -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect x="6" y="5" width="116" height="116" rx="25" fill="#f4f1ea" filter="url(#shadow)"/>
  <rect x="20" y="18" width="72" height="26" fill="#1c1c1c"/>
  <rect x="20" y="56" width="24" height="54" fill="#1c1c1c"/>
  <rect x="48" y="56" width="44" height="22" fill="#1c1c1c"/>
  <!-- Where the pulled-out panel was: a dashed outline, drawn one side at a time so each corner is the same "L" and each side starts and ends with a dash. -->
  <g stroke="#1c1c1c" stroke-width="3" opacity=".8">
    <line x1="48" y1="89.5" x2="92" y2="89.5" stroke-dasharray="5.6 4"/>
    <line x1="48" y1="108.5" x2="92" y2="108.5" stroke-dasharray="5.6 4"/>
    <line x1="49.5" y1="88" x2="49.5" y2="110" stroke-dasharray="4.67 4"/>
    <line x1="90.5" y1="88" x2="90.5" y2="110" stroke-dasharray="4.67 4"/>
  </g>
  <rect x="63.6" y="79.8" width="52.8" height="26.4" fill="#d23c2c" transform="rotate(14 90 93)"/>
</svg>
